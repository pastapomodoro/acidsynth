<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>BenzodiazeSynth</title>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.28/Tone.js"></script>
		<link
			href="https://fonts.googleapis.com/css?family=Material+Icons&display=block"
			rel="stylesheet"
		/>
		<script src="../build/components.js"></script>
		<script src="../build/tone-ui.js"></script>
		<link rel="stylesheet" href="../node_modules/@fontsource/inter/index.css">
		<link rel="stylesheet" href="../node_modules/@fontsource/space-grotesk/index.css">
		<style>
			body {
				font-family: 'Inter', 'Space Grotesk', Arial, sans-serif;
				background: #f6f6f6;
				color: #181818;
				margin: 0;
				padding: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				min-height: 100vh;
			}
			#main-panel {
				background: #fff;
				border-radius: 18px;
				box-shadow: 0 4px 32px 0 #0001;
				margin-top: 32px;
				padding: 32px 32px 24px 32px;
				width: 90vw;
				max-width: 900px;
				display: flex;
				flex-direction: column;
				gap: 32px;
			}
			#controls-panel {
				display: flex;
				flex-direction: row;
				justify-content: space-between;
				gap: 32px;
				background: #f2f2f2;
				border-radius: 12px;
				padding: 24px 16px 16px 16px;
				box-shadow: 0 2px 8px 0 #0000;
			}
			.control-group {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 18px;
				min-width: 160px;
			}
			.control-group h3 {
				margin: 0 0 8px 0;
				font-size: 1.05em;
				font-family: 'Space Grotesk', 'Inter', Arial, sans-serif;
				font-weight: 700;
				letter-spacing: 0.04em;
				color: #181818;
				text-transform: uppercase;
			}
			.slider-row {
				display: flex;
				flex-direction: row;
				align-items: flex-end;
				gap: 32px;
				flex-wrap: wrap;
				justify-content: flex-start;
			}
			.slider-col {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 8px;
				min-width: 120px;
				max-width: 180px;
				flex: 1 1 140px;
				background: #fff;
				border: 1px solid #ececec;
				border-radius: 14px;
				box-shadow: 0 2px 12px 0 #0001;
				padding: 18px 14px 14px 14px;
				margin: 0 0 0 0;
			}
			.slider-label {
				font-size: 0.97em;
				color: #888;
				font-family: 'Inter', Arial, sans-serif;
				font-weight: 500;
				text-align: center;
				margin-bottom: 2px;
			}
			.slider-value {
				font-size: 1em;
				color: #222;
				font-family: 'Space Grotesk', 'Inter', Arial, sans-serif;
				font-weight: 600;
				margin-top: 2px;
				letter-spacing: 0.01em;
			}
			tone-slider, input[type="range"]#master-volume {
				appearance: none;
				background: #eaeaea;
				height: 4px;
				border-radius: 2px;
				margin: 0;
				width: 120px;
				box-shadow: 0 1px 2px #0001;
			}
			tone-slider::-webkit-slider-thumb, input[type="range"]#master-volume::-webkit-slider-thumb {
				appearance: none;
				width: 18px;
				height: 18px;
				border-radius: 50%;
				background: linear-gradient(135deg, #ffb300 60%, #00cfff 100%);
				box-shadow: 0 2px 8px #0002;
				border: none;
				transition: background 0.2s;
			}
			tone-slider:focus, input[type="range"]#master-volume:focus {
				outline: 2px solid #00cfff;
			}
			input[type="range"]#master-volume {
				accent-color: #ffb300;
				background: #eaeaea;
				border-radius: 2px;
				width: 120px;
				margin: 0;
			}
			#start-button, #tb303-pattern-btn, #tb303-melody-btn {
				background: #181818;
				color: #fff;
				border: none;
				border-radius: 8px;
				padding: 12px 28px;
				font-size: 1em;
				font-family: 'Space Grotesk', 'Inter', Arial, sans-serif;
				font-weight: 700;
				letter-spacing: 0.04em;
				margin: 0 8px 0 0;
				box-shadow: 0 2px 8px 0 #0001;
				transition: background 0.2s, color 0.2s;
				cursor: pointer;
			}
			#start-button:hover, #tb303-pattern-btn:hover, #tb303-melody-btn:hover {
				background: #ffb300;
				color: #181818;
			}
			hr {
				border: none;
				height: 2px;
				background: linear-gradient(90deg, #ffb300 0%, #00cfff 100%);
				margin: 24px 0;
				border-radius: 2px;
			}
			@media (max-width: 1100px) {
				.slider-row { gap: 18px; }
				.slider-col { min-width: 100px; max-width: 100%; flex: 1 1 100px; }
			}
			@media (max-width: 700px) {
				.slider-row { flex-direction: column; gap: 12px; }
				.slider-col { width: 100%; min-width: 0; max-width: 100%; }
			}
		</style>
	</head>
	<body>
		<h1>BenzodiazeSynth <span style="font-size:0.6em; color:#bfa800; text-shadow:0 0 8px #fff700; vertical-align:middle;">⚡</span></h1>
		<button id="start-button">Start Audio</button>
		<button id="tb303-pattern-btn" style="margin-bottom:10px;">Pattern TB-303 Famoso</button>
		<button id="tb303-melody-btn" style="margin-bottom:10px; margin-left:10px;">Pattern TB-303 Melodico</button>
		<hr style="width:100%; margin: 20px 0;">

		<div id="main-panel">
			<div id="controls-panel">
				<div class="control-group">
					<h3>Transport</h3>
					<div class="slider-row">
						<div class="slider-col">
							<div class="slider-label">Play</div>
							<tone-play-toggle id="play-button"></tone-play-toggle>
						</div>
						<div class="slider-col">
							<div class="slider-label">BPM</div>
							<tone-number id="bpm-input" min="60" max="240" value="130"></tone-number>
						</div>
					</div>
				</div>
				<div class="control-group">
					<h3>Filter</h3>
					<div class="slider-row">
						<div class="slider-col">
							<div class="slider-label">Cutoff</div>
							<tone-slider id="cutoff-slider" min="200" max="8000" value="500" step="10"></tone-slider>
							<div class="slider-value" id="cutoff-value"></div>
						</div>
						<div class="slider-col">
							<div class="slider-label">Resonance</div>
							<tone-slider id="resonance-slider" min="0" max="18" value="8" step="0.1"></tone-slider>
							<div class="slider-value" id="resonance-value"></div>
						</div>
					</div>
				</div>
				<div class="control-group">
					<h3>Envelope</h3>
					<div class="slider-row">
						<div class="slider-col">
							<div class="slider-label">Decay</div>
							<tone-slider id="decay-slider" min="0.1" max="2" value="0.8" step="0.01"></tone-slider>
							<div class="slider-value" id="decay-value"></div>
						</div>
						<div class="slider-col">
							<div class="slider-label">Accent</div>
							<tone-slider id="accent-slider" min="0" max="1" value="0.3" step="0.01"></tone-slider>
							<div class="slider-value" id="accent-value"></div>
						</div>
					</div>
				</div>
				<div class="control-group">
					<h3>Drive</h3>
					<div class="slider-row">
						<div class="slider-col">
							<div class="slider-label">Distortion</div>
							<tone-slider id="distortion-slider" min="0" max="1" value="0.2" step="0.01"></tone-slider>
							<div class="slider-value" id="distortion-value"></div>
						</div>
						<div class="slider-col">
							<div class="slider-label">Slide</div>
							<tone-slider id="slide-slider" min="0" max="0.5" value="0.1" step="0.01"></tone-slider>
							<div class="slider-value" id="slide-value"></div>
						</div>
					</div>
				</div>
				<div class="control-group">
					<h3>Volume</h3>
					<div class="slider-row">
						<div class="slider-col">
							<div class="slider-label">Volume</div>
							<input type="range" id="master-volume" min="-60" max="0" value="-6" step="1">
							<div class="slider-value" id="volume-value"></div>
						</div>
					</div>
				</div>
			</div>
			<tone-step-sequencer id="sequencer" rows="8" columns="16"></tone-step-sequencer>
		</div>

		<script>
			// --- UTILS ---
			customElements.whenDefined('tone-step-sequencer').then(() => {
				const sequencer = document.querySelector("#sequencer");
				// Pattern di default ispirato a js303
				const initialPattern = [
					[0,1,false,true,false,false], // accent
					[0,0,true,true,false,false], // slide
					[0,0,true,true,false,false],
					[0,0,true,true,false,false],
					[0,0,false,true,false,false],
					[0,0,true,true,false,false],
					[0,1,true,true,false,false], // accent+slide
					[0,0,true,true,false,false],
					[0,0,false,true,false,false],
					[4,1,false,true,false,false], // accent
					[1,0,false,true,false,false],
					[5,1,false,true,false,false], // accent
					[2,0,false,true,false,false],
					[6,0,false,true,false,false],
					[6,1,true,true,true,false], // accent+slide+down
					[6,0,true,true,true,false], // slide+down
				];
				// Applica pattern
				for (let col = 0; col < 16; col++) {
					const [row, accent, slide, gate] = [initialPattern[col][0], initialPattern[col][1], initialPattern[col][2], initialPattern[col][3]];
					sequencer.set(col, row, gate);
				}
			});

			// --- TB-303 STYLE SYNTH CLONE ---
			const params = {
				waveform: "sawtooth", // js303: 0=saw, 1=square
				tuning: 0, // semitoni
				cutoff: 240, // Hz
				resonance: 1.0, // 0..1
				envmod: 0.0, // 0..1
				decay: 0.1, // secondi (100ms)
				accent: 0.0, // 0..1
				dist_shape: 0.0, // foldback
				dist_threshold: 1.0, // foldback
			};

			const oscillator = new Tone.Oscillator({
				type: params.waveform,
				frequency: "C3"
			});

			const filter = new Tone.Filter({
				type: "lowpass",
				frequency: params.cutoff,
				Q: 18 * params.resonance + 1
			});

			const envelope = new Tone.Envelope({
				attack: 0.001,
				decay: params.decay,
				sustain: 0,
				release: 0.1
			});

			const filterEnvelope = new Tone.FrequencyEnvelope({
				attack: 0.001,
				decay: params.decay,
				sustain: 0,
				release: 0.1,
				baseFrequency: params.cutoff,
				octaves: 3.5 * (params.envmod + 0.2)
			});

			const compressor = new Tone.Compressor({
				threshold: -20,
				ratio: 4,
				attack: 0.003,
				release: 0.1
			});

			// DEBUG: Catena audio semplificata
			oscillator.connect(filter);
			filter.connect(Tone.Destination);
			envelope.connect(filter.frequency);
			filterEnvelope.connect(filter.frequency);

			const scale = ["C3", "Eb3", "F3", "G3", "Bb3", "C4", "Eb4", "F4"];
			let currentNote = null;
			let slideTime = 0.1;
			let oscillatorStarted = false;

			// --- UI BINDING ---
			document.querySelector("#start-button").addEventListener("click", async () => {
				await Tone.start();
				document.querySelector("#start-button").textContent = "Audio Ready!";
				// DEBUG: Avvia subito l'oscillatore per sentire se suona
				if (!oscillatorStarted) {
					oscillator.start();
					oscillatorStarted = true;
				}
			});
			
			// Volume master
			const masterVolume = new Tone.Volume(-6).toDestination();
			// Catena audio aggiornata: oscillator -> filter -> masterVolume -> Destination
			oscillator.disconnect();
			filter.disconnect();
			oscillator.connect(filter);
			filter.connect(masterVolume);
			envelope.connect(filter.frequency);
			filterEnvelope.connect(filter.frequency);

			document.querySelector("#sequencer").addEventListener("trigger", ({ detail }) => {
				console.log("TRIGGER", detail);
				const { row, time, column } = detail;
				const note = scale[scale.length - 1 - row];
				const freq = Tone.Frequency(note).toFrequency();
				// Pattern di default allineato a 16 colonne
				const pattern = [
					[0,1,false,true,false,false],
					[0,0,true,true,false,false],
					[0,0,true,true,false,false],
					[0,0,true,true,false,false],
					[0,0,false,true,false,false],
					[0,0,true,true,false,false],
					[0,1,true,true,false,false],
					[0,0,true,true,false,false],
					[0,0,false,true,false,false],
					[4,1,false,true,false,false],
					[1,0,false,true,false,false],
					[5,1,false,true,false,false],
					[2,0,false,true,false,false],
					[6,0,false,true,false,false],
					[6,1,true,true,true,false],
					[6,0,true,true,true,false],
				];
				const step = pattern[column % pattern.length] || [0,0,false,true,false,false];
				const accent = step[1];
				const slide = step[2];

				// Accent: modula envelope/filterEnvelope e volume solo sugli step accentati
				const envmod = accent ? 0.8 : params.envmod;
				const decay = accent ? params.decay * 1.3 : params.decay;
				const cutoff = accent ? params.cutoff + 200 : params.cutoff;
				const accentGain = accent ? 1.2 : 1.0;

				envelope.decay = decay;
				filterEnvelope.decay = decay;
				filterEnvelope.baseFrequency = cutoff;
				filterEnvelope.octaves = 3.5 * (envmod + 0.2);
				masterVolume.volume.value = parseInt(masterVolumeSlider.value, 10) + (accent ? 2 : 0); // leggero boost sugli accent

				// Cambia la frequenza dell'oscillatore (slide solo se step slide)
				if (currentNote !== null && slide) {
					oscillator.frequency.linearRampToValueAtTime(freq, "+" + slideTime);
				} else {
					oscillator.frequency.setValueAtTime(freq, Tone.now());
				}
				currentNote = freq;

				envelope.triggerAttackRelease("16n", Tone.now());
				filterEnvelope.triggerAttackRelease("16n", Tone.now());
			});
			
			document.querySelector("#play-button").addEventListener("start", () => {
				if (!oscillatorStarted) {
					oscillator.start();
					oscillatorStarted = true;
				}
				Tone.Transport.start();
			});
			document.querySelector("#play-button").addEventListener("stop", () => {
				Tone.Transport.stop();
				if (oscillatorStarted) {
					oscillator.stop();
					oscillatorStarted = false;
					currentNote = null;
				}
			});
			
			const bpmInput = document.querySelector("#bpm-input");
			Tone.Transport.bpm.value = 100;
			bpmInput.addEventListener("value", (e) => {
				Tone.Transport.bpm.value = e.detail.value;
			});

			// Filter controls
			const cutoffSlider = document.querySelector("#cutoff-slider");
			cutoffSlider.value = params.cutoff;
			cutoffSlider.addEventListener("input", (e) => {
				params.cutoff = e.detail.value;
				filterEnvelope.baseFrequency = params.cutoff;
				filter.frequency.value = params.cutoff;
			});

			const resonanceSlider = document.querySelector("#resonance-slider");
			resonanceSlider.value = params.resonance * 18 + 1;
			resonanceSlider.addEventListener("input", (e) => {
				params.resonance = (e.detail.value - 1) / 18;
				filter.Q.value = e.detail.value;
			});

			// Envelope controls
			const decaySlider = document.querySelector("#decay-slider");
			decaySlider.value = params.decay;
			decaySlider.addEventListener("input", (e) => {
				params.decay = e.detail.value;
				envelope.decay = params.decay;
				filterEnvelope.decay = params.decay;
			});

			const accentSlider = document.querySelector("#accent-slider");
			accentSlider.value = params.accent;
			accentSlider.addEventListener("input", (e) => {
				params.accent = e.detail.value;
			});

			// Drive controls
			const distortionSlider = document.querySelector("#distortion-slider");
			distortionSlider.value = params.dist_shape;
			distortionSlider.addEventListener("input", (e) => {
				params.dist_shape = e.detail.value;
				// foldback.curve = foldbackCurve(params.dist_threshold, params.dist_shape);
			});

			const slideSlider = document.querySelector("#slide-slider");
			slideSlider.value = slideTime;
			slideSlider.addEventListener("input", (e) => {
				slideTime = e.detail.value;
			});

			// Volume slider binding
			const masterVolumeSlider = document.getElementById("master-volume");
			masterVolumeSlider.addEventListener("input", (e) => {
				masterVolume.volume.value = parseInt(e.target.value, 10);
			});

			// Bottone per pattern TB-303 famoso
			document.getElementById("tb303-pattern-btn").addEventListener("click", () => {
				const sequencer = document.querySelector("#sequencer");
				// Esempio: pattern ispirato a 'Acid Tracks' (Phuture)
				// (Nota: la mappatura delle righe dipende dalla tua scala, qui uso una sequenza tipica)
				const acidPattern = [
					[0,1], [1,0], [2,0], [3,1],
					[4,0], [5,1], [6,0], [7,1],
					[6,0], [5,1], [4,0], [3,1],
					[2,0], [1,1], [0,0], [1,1],
				];
				// Reset sequencer
				for (let col = 0; col < 16; col++) {
					for (let row = 0; row < 8; row++) {
						sequencer.set(col, row, false);
					}
				}
				// Applica nuovo pattern
				acidPattern.forEach(([row, accent], col) => {
					sequencer.set(col, row, true);
					// Accent: opzionale, puoi aggiungere logica per accent se il sequencer lo supporta
				});
			});

			document.getElementById("tb303-melody-btn").addEventListener("click", () => {
				const sequencer = document.querySelector("#sequencer");
				// Pattern melodico, più ascoltabile (esempio in scala maggiore)
				const melodyPattern = [
					[0,1], [2,0], [4,0], [5,1],
					[4,0], [2,1], [0,0], [2,1],
					[4,0], [5,1], [7,0], [5,1],
					[4,0], [2,1], [0,0], [2,1],
				];
				// Reset sequencer
				for (let col = 0; col < 16; col++) {
					for (let row = 0; row < 8; row++) {
						sequencer.set(col, row, false);
					}
				}
				// Applica nuovo pattern
				melodyPattern.forEach(([row, accent], col) => {
					sequencer.set(col, row, true);
					// Accent: opzionale, puoi aggiungere logica per accent se il sequencer lo supporta
				});
			});

			// Aggiorna i valori numerici sotto ogni slider
			function updateSliderValue(id, value) {
				document.getElementById(id).textContent = value;
			}

			document.getElementById('cutoff-slider').addEventListener('input', e => updateSliderValue('cutoff-value', e.detail.value || e.target.value));
			document.getElementById('resonance-slider').addEventListener('input', e => updateSliderValue('resonance-value', e.detail.value || e.target.value));
			document.getElementById('decay-slider').addEventListener('input', e => updateSliderValue('decay-value', e.detail.value || e.target.value));
			document.getElementById('accent-slider').addEventListener('input', e => updateSliderValue('accent-value', e.detail.value || e.target.value));
			document.getElementById('distortion-slider').addEventListener('input', e => updateSliderValue('distortion-value', e.detail.value || e.target.value));
			document.getElementById('slide-slider').addEventListener('input', e => updateSliderValue('slide-value', e.detail.value || e.target.value));
			document.getElementById('master-volume').addEventListener('input', e => updateSliderValue('volume-value', e.target.value));
			// Inizializza valori
			updateSliderValue('cutoff-value', document.getElementById('cutoff-slider').value);
			updateSliderValue('resonance-value', document.getElementById('resonance-slider').value);
			updateSliderValue('decay-value', document.getElementById('decay-slider').value);
			updateSliderValue('accent-value', document.getElementById('accent-slider').value);
			updateSliderValue('distortion-value', document.getElementById('distortion-slider').value);
			updateSliderValue('slide-value', document.getElementById('slide-slider').value);
			updateSliderValue('volume-value', document.getElementById('master-volume').value);
		</script>
	</body>
</html>
